---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

# A v* tag builds the multi-platform archives with GoReleaser, signs the
# SHA256SUMS file with the release GPG key and publishes everything as a
# GitHub Release, which the OpenTofu registry reads.
#
# Secrets (environment `release`): GPG_PRIVATE_KEY (ASCII-armored, no
# passphrase) and GPG_FINGERPRINT. The environment requires an approval, so a
# pushed tag alone cannot use the signing key.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: --locked
          cache: false
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$GPG_FINGERPRINT" > /dev/null
      - name: GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: goreleaser release --clean
